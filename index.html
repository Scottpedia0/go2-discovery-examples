<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go2 Discovery — Examples</title>
<style>
:root{--bg:#0a0a0a;--card:#111113;--border:#2a2a2e;--text:#e4e4e7;--dim:#a1a1aa;--accent:#5eead4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:40px 20px;max-width:800px;margin:0 auto}
h1{color:var(--accent);font-size:28px;margin-bottom:8px;font-weight:600;letter-spacing:-0.5px}
.sub{color:var(--dim);font-size:15px;margin-bottom:40px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:12px}
.card p{color:var(--dim);font-size:14px;margin-bottom:12px}
</style>
</head>
<body>
<h1>Go2 Discovery — Examples</h1>
<p class="sub">AI-powered operational analysis. Real reports from real data.</p>
<div class="card">
<p>Browse the full report archive:</p>
<p><a href="scott-moran/">Scott Moran — Individual Discovery Reports →</a></p>
</div>
<div class="card">
<p>Team onboarding:</p>
<p><a href="frenchie/">Frenchie Evangelista — Engage Onboarding Brief →</a></p>
</div>
</body>
</html>
